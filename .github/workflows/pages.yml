name: Deploy Party Balloons Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build single protected root entry
        run: |
          mkdir -p _site
          cp -f *.html *.css *.js _site/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('</head>', '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><style id="privateBootStyle">body.private-locked .app-shell{visibility:hidden}</style></head>')
          s = s.replace('<body>', '<body class="private-locked">', 1)
          old = '<script src="app.js?v=20260823-dual-v1"></script>\n<script src="structure-select.js?v=20260826-history3"></script>'
          new = '<script src="private-access.js?v=20260828-private-proxy1"></script>'
          if old not in s:
              raise SystemExit('Expected dashboard script entry was not found in index.html')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          redirect = '''<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0; url=./?v=20260828-private-proxy1"><title>正在进入私有看板</title></head><body><script>location.replace('./?v=20260828-private-proxy1')</script></body></html>'''
          Path('_site/404.html').write_text(redirect, encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
